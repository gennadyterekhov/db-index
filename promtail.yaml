server:
    http_listen_port: 9080
    grpc_listen_port: 0

positions:
    filename: /tmp/positions.yaml

clients:
    - url: http://loki:3100/loki/api/v1/push

scrape_configs:
    # Scrape logs from Docker containers (simplified)
    - job_name: docker-containers
      docker_sd_configs:
          - host: unix:///var/run/docker.sock
            refresh_interval: 10s
            filters:
                - name: label
                  values: ["logging=promtail"]

      relabel_configs:
          # Add container name as label
          - source_labels: ['__meta_docker_container_name']
            regex: '/(.*)'
            target_label: 'container'
            action: replace

          # Add service name as label
          - source_labels: ['__meta_docker_container_name']
            regex: '/(.*)'
            target_label: 'service'
            action: replace

          # Only collect logs from containers with the logging=promtail label
          - source_labels: ['__meta_docker_container_label_logging']
            regex: 'promtail'
            action: keep

    # Alternative: Scrape specific log files
    - job_name: static-logs
      static_configs:
          - targets:
                - local
            labels:
                job: php
                service: php
                environment: local
                __path__: /var/log/my-app/*log