auth_enabled: false

server:
    http_listen_port: 3100
    grpc_listen_port: 9096
    # Add these lines to reduce WebSocket timeouts
    http_server_read_timeout: 5m
    http_server_write_timeout: 5m
    grpc_server_max_recv_msg_size: 104857600  # 100MB
    grpc_server_max_send_msg_size: 104857600  # 100MB

common:
    path_prefix: /loki
    storage:
        filesystem:
            chunks_directory: /loki/chunks
            rules_directory: /loki/rules
    replication_factor: 1
    ring:
        instance_addr: 127.0.0.1
        kvstore:
            store: inmemory

query_range:
    results_cache:
        cache:
            embedded_cache:
                enabled: true
                max_size_mb: 100

schema_config:
    configs:
        - from: 2020-10-24
          store: boltdb-shipper
          object_store: filesystem
          schema: v11
          index:
              prefix: index_
              period: 24h

ruler:
    alertmanager_url: http://localhost:9093
# Add this query_frontend section
#query_frontend:
#    max_retries: 2
#    align_queries_with_step: true

# Add limits configuration
limits_config:
    reject_old_samples: true
    reject_old_samples_max_age: 168h
    max_query_length: 721h
    max_query_parallelism: 32
    # These help with WebSocket connections
#    tail_max_duration: 1h
    max_streams_per_user: 10000


# By default, Loki will send anonymous, but uniquely-identifiable usage and configuration
# analytics to Grafana Labs. These statistics are sent to https://stats.grafana.org/
#
# For more details on what's sent, look at
# https://github.com/grafana/loki/blob/main/pkg/analytics/stats.go
#
# If you would like to disable reporting, uncomment the following lines:
#analytics:
#  reporting_enabled: false