services:
    db:
        container_name: db
        image: mirror.gcr.io/postgres:${POSTGRES_VERSION:-16}-alpine
        volumes:
            - db_index_postgres_data:/var/lib/postgresql/data:rw
        environment:
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
            POSTGRES_USER: ${POSTGRES_USER:-postgres}
            POSTGRES_DB: ${POSTGRES_DB:-postgres}
        ports:
            - "54321:5432"

    db_test:
        container_name: db_test
        image: mirror.gcr.io/postgres:${POSTGRES_VERSION:-16}-alpine
        volumes:
            - db_index_postgres_test_data:/var/lib/postgresql/data:rw
        environment:
            POSTGRES_PASSWORD: test
            POSTGRES_USER: test
            POSTGRES_DB: db_test
        ports:
            - "5433:5432"

    php:
        container_name: php
        build:
            context: .
            dockerfile: docker/app/Dockerfile
        command: [ 'php-fpm', '--nodaemonize' ]
        depends_on:
            - db
        working_dir: /var/www/app
        extra_hosts:
            - host.docker.internal:host-gateway
        volumes:
            - ./:/var/www/app
        environment:
            CORS_ALLOW_ORIGIN: '*'
        labels:
            - "logging=promtail"  # This label tells Promtail to scrape this container
    back-nginx:
        container_name: back-nginx
        image: mirror.gcr.io/nginx:1.27-alpine
        restart: always
        volumes:
            - ./docker/nginx/local/default.conf:/etc/nginx/conf.d/default.conf
            - ./:/var/www/app
        depends_on:
            - php
        ports:
            - "81:80"

    loki:
        image: grafana/loki:2.9.0
        container_name: loki
        ports:
            - "3100:3100"
        command: -config.file=/etc/loki/local-config.yaml
        volumes:
            - ./loki.yaml:/etc/loki/local-config.yaml
            - loki-data:/loki

    # Promtail - log collector
    promtail:
        image: grafana/promtail:2.9.0
        container_name: promtail
        volumes:
            - ./promtail.yaml:/etc/promtail/config.yaml
            - ./app-logs:/var/log/my-app:ro  # Read-only access to app logs
            - /var/lib/docker/containers:/var/lib/docker/containers:ro
            - /var/run/docker.sock:/var/run/docker.sock
        command: -config.file=/etc/promtail/config.yaml
        depends_on:
            - loki

    # Grafana - visualization
    grafana:
        image: grafana/grafana:10.2.0
        container_name: grafana
        ports:
            - "3000:3000"
        environment:
            - GF_SECURITY_ADMIN_PASSWORD=admin
        volumes:
            - grafana-data:/var/lib/grafana
            - ./datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml
        depends_on:
            - loki



volumes:
    loki-data:
    grafana-data:
    db_index_postgres_data:
    db_index_postgres_test_data:
